name: Release Buzz Foundation

# Builds, signs, and publishes a new Buzz Foundation desktop release whenever a
# version tag (e.g. `v1.0.5-1`) is pushed. Existing installs with the Tauri
# updater configured (see src-tauri/tauri.conf.json's plugins.updater.endpoints)
# poll this repo's GitHub Releases and prompt users to update automatically.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Add Rust target
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build sidecar binaries
        run: |
          node scripts/build-goose-acp.mjs
          node scripts/build-agent-command.mjs
          node scripts/build-buzz-cli.mjs
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUZZ_UPDATER_PUBLIC_KEY: "dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDFBNjZEMTFCNjJFNzk1NkMKUldSc2xlZGlHOUZtR3VUTXhMcXAxeHFRSCtYeklYQjlvaFJOeDhWbkFtYkF6MTVmbm5pOTVIdHMK"
          BUZZ_UPDATER_ENDPOINT: "https://github.com/ranjank2alpha/buzz-v1.0plus-app/releases/latest/download/latest.json"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Buzz Foundation ${{ github.ref_name }}"
          releaseBody: "Buzz Foundation release ${{ github.ref_name }}."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.args }}
